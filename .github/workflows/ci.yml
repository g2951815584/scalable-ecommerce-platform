name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: uvx ruff check .

      - name: Unit tests (one service at a time)
        run: |
          set -e
          for svc in services/*/; do
            if [ -d "$svc/tests" ]; then
              echo "==> testing $svc"
              (cd "$svc" && PYTHONPATH=. uv run --project ../.. pytest -q)
            fi
          done

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (compose stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Build and start the full stack
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml up --build -d --wait --wait-timeout 300

      - name: Run database migrations
        run: |
          set -e
          for svc in user catalog cart order payment notification; do
            echo "==> migrating $svc"
            docker compose --env-file .env -f infra/docker-compose.yml exec -T "$svc-service" alembic upgrade head
          done

      - name: Set up uv (for seed/E2E scripts)
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-packages

      - name: Seed demo data
        working-directory: backend
        run: uv run python scripts/seed_data.py

      - name: Run E2E checkout
        working-directory: backend
        run: uv run python scripts/e2e_checkout.py