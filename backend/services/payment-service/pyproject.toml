[project]
name = "payment-service"
version = "0.1.0"
description = "Payment, refund and reconciliation service"
requires-python = ">=3.12"
dependencies = [
  "ecommerce-common",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]