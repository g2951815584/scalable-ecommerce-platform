[project]
name = "ecommerce-backend"
version = "0.1.0"
description = "Scalable e-commerce backend workspace"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
  "libs/common",
  "services/user-service",
  "services/catalog-service",
  "services/cart-service",
  "services/order-service",
  "services/payment-service",
  "services/notification-service",
]

[tool.uv.sources]
ecommerce-common = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.23,<1",
  "freezegun>=1.5,<2",
  "fakeredis>=2.26,<3",
  "respx>=0.21,<1",
  "testcontainers[postgres,redis,rabbitmq]>=4.9,<5",
  "httpx>=0.27,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in defaults is idiomatic and unavoidable.
# BLE001: Deliberate `except Exception` (constant-time password verify, and
#         compensation paths that must never mask the root error).
# UP046/UP047: pre-PEP-695 generics are still used across the codebase.
ignore = ["B008", "BLE001", "UP046", "UP047"]

[tool.pytest.ini_options]
testpaths = ["services/*/tests"]
addopts = "-q"
