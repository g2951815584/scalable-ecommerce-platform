[project]
name = "ecommerce-common"
version = "0.1.0"
description = "Shared contracts and infrastructure for e-commerce services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "redis>=5.0,<6",
  "aio-pika>=9.4,<10",
  "httpx>=0.27,<1",
  "pyjwt[crypto]>=2.9,<3",
  "cryptography>=42,<46",
  "argon2-cffi>=23.1,<26",
  "apscheduler>=3.10,<4",
  "prometheus-client>=0.21,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
